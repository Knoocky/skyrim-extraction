name: Core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:content
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run qa:combat -- 100
      - run: npm run qa:raid -- 600
      - run: npm run demo
      - run: npm run check:bindings -- config/bindings.example.json --template
      - name: Independent scenarios and bounded service soak
        if: runner.os == 'Linux'
        run: |
          npm run qa:extended -- 10000
          node scripts/qa-service.ts 30
      - name: Portable runtime package
        run: npm run package -- core-0.9.0.sxe.gz
      - name: Install test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install test browser on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Browser economy, combat and retry tests
        run: npm run test:browser
      - name: Browser screenshots and failure context
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-windows
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose run --rm init
      - run: docker compose up -d --wait core
      - run: docker compose exec -T core node scripts/container-smoke.ts
      - run: docker compose restart core
      - run: docker compose up -d --wait core
      - run: docker compose exec -T core node scripts/container-smoke.ts
      - run: docker compose exec -T core node scripts/backup.mjs data/core.sqlite data/ci-backup.sqlite
      - run: docker compose exec -T core node scripts/doctor.mjs
      - name: Clean isolated CI volume
        if: always()
        run: docker compose down -v
